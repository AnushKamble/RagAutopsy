[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-autopsy"
version = "0.1.0"
description = "Fault-Injection-Validated Failure Attribution for RAG Systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "RAG-Autopsy Contributors"}
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "fault-injection",
    "failure-attribution",
    "evaluation",
    "nlp"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "matplotlib>=3.8.0",
]
plots = [
    "matplotlib>=3.8.0",
]
nli = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
]

[project.scripts]
rag-autopsy = "rag_autopsy.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
