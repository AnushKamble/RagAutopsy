protocol_version: "1.0.0"
status: "FROZEN"
registration_date: "2026-10-18T23:30:00Z"
project_name: "RAG-Autopsy"
project_id: "AI-01"

research_questions:
  - id: "RQ1"
    question: "How accurately can low-cost black-box diagnostics attribute observed RAG failures to the pipeline stage or intervention responsible, without access to gold evidence metadata?"
    hypotheses:
      - id: "H1"
        statement: "The combined diagnostic policy (D4) achieves a Macro-F1 whose 95% bootstrap CI strictly exceeds the Majority-Cause Baseline and Random Baseline on valid held-out injected trials."
      - id: "H2"
        statement: "Context assembly loss (F3) is identifiable with >= 95% recall from structural diffs between pre-assembly and post-assembly traces without gold labels."
  - id: "RQ2"
    question: "Can observational diagnostics distinguish missing evidence (F1) from ranking displacement (F2) under different observability regimes without corpus oracle?"
    hypotheses:
      - id: "H3"
        statement: "In Regime A (candidate pool visible), score cliff and density heuristics separate F1 and F2 with > 70% recall; in Regime B (blind top-k), F1 and F2 are indistinguishable, necessitating honest abstention (UNKNOWN: AMBIGUOUS_RETRIEVAL_MISS) rather than faked diagnosability."
  - id: "RQ3"
    question: "What is the boundary between lexical surface matching and semantic entailment for grounding verification?"
    hypotheses:
      - id: "H4"
        statement: "D2 lexical keyword overlap achieves high coverage on verbatim context usage but misdiagnoses abstractive paraphrasing (false F1) and entity-copied hallucinations (false F0), requiring NLI (D3) for full entailment verification."

data_and_splits:
  source_dataset: "HotpotQA Development Set (Distractor setting, v1.1)"
  sample_size: 100
  split_ratios:
    dev: 0.60
    calibration: 0.20
    test: 0.20
  random_seed: 42
  grouping_invariant: "All variants (F0-F5) of a source question/document must reside strictly in the same split partition."
  disjointness_rule: "dev_ids ∩ calibration_ids ∩ test_ids = ∅"
  manifest_file: "configs/split_manifest_100.json"
  held_out_policy: "Test split questions are quarantined and untouched during development, threshold tuning, and design iteration."

fault_parameters:
  F0:
    name: "Nominal RAG Execution"
    description: "Clean RAG execution with unperturbed corpus and default prompt."
    severity: 0.0
  F1:
    name: "Evidence Unavailable"
    description: "Gold supporting evidence purged from the retrieval corpus."
    purge_mode: "complete"
    severity: 1.0
  F2:
    name: "Evidence Ranked Out"
    description: "Target evidence displaced beyond top-k by injecting query-targeted distractors."
    distractor_count: 5
    cutoff_k: 3
    bm25_score_boost: 1.5
    severity: 0.8
  F3:
    name: "Context Assembly Loss"
    description: "Retrieved gold passage omitted during context assembly due to window truncation or prioritization."
    cutoff_window_chars: 3000
    drop_mode: "gold_omission"
    severity: 0.6
  F4:
    name: "Contradictory Context Evidence"
    description: "Gold passage mutated to inject conflicting/contradictory facts into context."
    mutation_type: "antonym_negation"
    severity: 0.7
  F5:
    name: "Unsupported Generation / Hallucination"
    description: "Generator outputs fabricated claim contradicting or unsupported by retrieved context."
    mutation_type: "predicate_substitution"
    severity: 0.9

validity_adjudication:
  adjudication_rule: "A trial is valid iff injection_applied == True AND trace_condition_achieved == True AND all preconditions are satisfied."
  preconditions:
    F0: "Corpus contains gold evidence passage; retrieval and generation execute without errors."
    F1: "Gold evidence passages exist in base corpus prior to trial-scoped removal."
    F2: "Gold evidence passage exists in corpus but rank > top_k after distractor addition."
    F3: "Gold evidence passage was successfully retrieved in top_k before context assembly."
    F4: "Gold evidence passage was retrieved in top_k and mutated contradictory version is present in generator context."
    F5: "Gold evidence was present in context, and generator output failed grounding check."
  invalid_reasons:
    - "NO_GOLD_EVIDENCE_IN_CORPUS"
    - "GOLD_STILL_IN_TOP_K_DESPITE_DISTRACTORS"
    - "PRECONDITION_FAILED_GOLD_MISSED_TOP_K"
    - "CONTRADICTION_NOT_ASSEMBLED_INTO_CONTEXT"
  exclusion_policy: "Invalid trials are retained in validity accounting reports (attempted, valid, invalid counts and reasons) but excluded from primary attribution metrics."

trace_observability:
  permitted_features:
    - "trial_id"
    - "question_id"
    - "question"
    - "retrieved_top_k (ranks, scores, texts, passage_ids)"
    - "candidate_pool_scores (optional, Regime A only)"
    - "source_passage_ids"
    - "pre_assembly_passage_ids"
    - "post_assembly_passage_ids"
    - "generator_context"
    - "answer"
    - "latency_ms"
    - "generator_model"
    - "generator_config"
  forbidden_features:
    - "injected_fault"
    - "fault_parameters"
    - "gold_answer"
    - "gold_answers"
    - "gold_evidence_ids"
    - "target_rank"
    - "injection_applied"
    - "trace_condition_achieved"
    - "trial_valid"
    - "invalid_reason"
    - "EvaluatorRecord"

frozen_thresholds:
  calibration_source: "Calibration split (20 questions, 100 trials, completely disjoint from test)"
  calibration_file: "configs/frozen_calibration_params.yaml"
  low_score_threshold: 2.0
  score_gap_threshold: 1.0
  min_overlap_ratio: 0.3
  confidence_threshold: 0.65

metrics:
  primary:
    macro_f1: "Macro-averaged F1 across all target fault classes."
    balanced_accuracy: "Macro-averaged recall across all target fault classes."
    accuracy_among_covered: "Accuracy computed strictly on non-abstained trials."
    coverage: "Proportion of trials where the diagnostic issued a definitive prediction (non-UNKNOWN)."
  secondary:
    per_class_precision: "Precision per fault class."
    per_class_recall: "Recall per fault class."
    per_class_f1: "F1 per fault class."
    overall_accuracy: "Total correct predictions divided by total trials (abstentions counted as incorrect)."
    raw_confusion_matrix: "Unnormalized true-by-predicted trial count matrix."
    normalized_confusion_matrix: "Row-normalized confusion matrix (true class conditional distribution)."
    runtime: "Total diagnostic execution time (ms) and per-trial latency (ms/trial)."

uncertainty_estimation:
  method: "Clustered non-parametric bootstrap resampling"
  resampling_unit: "question_id"
  justification: "All fault variants of a single source question share passage content; resampling at the trial level would underestimate variance due to intra-cluster correlation."
  iterations: 1000
  alpha: 0.05
  interval_type: "95% percentile confidence interval [2.5%, 97.5%]"
  random_seed: 42

abstention_protocol:
  abstention_token: "UNKNOWN"
  rules:
    - "In Regime B (blind top-k), when top score < low_score_threshold, D1 cannot distinguish F1 from F2 and must abstain with UNKNOWN: AMBIGUOUS_RETRIEVAL_MISS."
    - "In D4, when retrieval and lexical support signals conflict with confidence < confidence_threshold (0.65), D4 must abstain rather than issuing a low-confidence guess."
  evaluation_rule: "Abstained trials reduce coverage. Conditional accuracy is evaluated on covered trials. For strict macro-F1 and balanced accuracy, abstentions are counted as errors (unmapped)."

planned_baselines_and_ablations:
  baselines:
    - name: "majority_cause_baseline"
      description: "Always predicts the empirical mode of the calibration partition (F0)."
    - name: "random_guessing_baseline"
      description: "Samples uniformly at random from candidate causes with fixed seed."
  standalone_diagnostics:
    - name: "d1_retrieval_rules"
      description: "Score distribution and candidate pool drop-off heuristics."
    - name: "d2_lexical_support"
      description: "Answer-context content word overlap and contradiction cue scan."
    - name: "d3_nli_support"
      description: "Transformer-based cross-encoder Natural Language Inference entailment/contradiction model."
  combined_diagnostics:
    - name: "d4_combined_policy"
      description: "Hierarchical synthesis with explicit abstention."
    - name: "d4_learned_classifier"
      description: "Decision tree / linear classifier trained on dev+calibration feature vectors."
  planned_ablations:
    - "D4 with Candidate Pool (Regime A) vs Blind Top-k (Regime B)"
    - "D4 with Abstention Enabled vs Disabled (Forced Choice)"
    - "D4 with Heuristic Rules vs Learned Feature Weights"
    - "D4 without Context Contradiction Scans (Ablated F4 branch)"
